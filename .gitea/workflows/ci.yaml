# Gitea Actions CI workflow.
# Pull mirrors are read-only, so the workflow file lives upstream.
#
# Required Actions secrets (repo-level):
#   - SOPS_AGE_KEY (only)
# Org-level secrets (REGISTRY_TOKEN, CONNECTION_PAT) are inherited.
# SSH keys for prod deploys come from the runner image's volume mount.

name: CI

on:
    push:

env:
    REGISTRY: gitea.zen.lofi

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - run: npm ci
            - uses: extractions/setup-just@v3
              with:
                  github-token: ${{ secrets.CONNECTION_PAT }}
            - name: Run lint
              run: just lint

    build-and-push:
        runs-on: ubuntu-latest
        env:
            IMAGE: ${{ env.REGISTRY }}/${{ gitea.repository }}
        steps:
            - uses: actions/checkout@v4

            - name: Log in to Gitea registry
              run: |
                  echo "${{ secrets.REGISTRY_TOKEN }}" | \
                    docker login "${{ env.REGISTRY }}" \
                      --username "${{ gitea.actor }}" \
                      --password-stdin

            - name: Build and push
              env:
                  GITEA_SHA: ${{ gitea.sha }}
              run: |
                  set -euo pipefail
                  SHORT="${GITEA_SHA:0:7}"
                  docker build -t "$IMAGE:$SHORT" -f Containerfile .
                  docker push "$IMAGE:$SHORT"

    deploy-prod:
        needs:
          - lint
          - build-and-push
        if: gitea.ref == 'refs/heads/fix-ci'
        runs-on: ubuntu-deploy
        env:
            HOST: web2.streetfortress.cloud
        steps:
            - uses: actions/checkout@v4
            - name: Deploy to prod
              env:
                  GITEA_SHA: ${{ gitea.sha }}
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
              run: |
                  set -euo pipefail
                  SHORT="${GITEA_SHA:0:7}"
                  just deploy-prod "$HOST" "$SHORT"
